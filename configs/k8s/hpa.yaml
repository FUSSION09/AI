apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apex-msmg-hpa
  namespace: apex-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apex-msmg-gateway
  minReplicas: 2
  maxReplicas: 16
  metrics:
    # 1. Primary Resource Metric: CPU Utilization (>70%)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 2. Memory Pressure Metric: Memory Utilization (>80%)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # 3. Custom Orchestrator Metric: Queue Depth (>5 items per pod)
    - type: Pods
      pods:
        metric:
          name: apex_active_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min

