apiVersion: v1
kind: Service
metadata:
  name: apex-msmg-service
  namespace: apex-system
  labels:
    app: apex-msmg
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app: apex-msmg
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

